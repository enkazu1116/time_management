services:
  postgres:
    image: postgres:16-alpine
    container_name: time_management_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: time_management
      POSTGRES_PASSWORD: time_management
      POSTGRES_DB: time_management
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/persistence/postgres/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_management -d time_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
